<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para María 💛</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="message-container">
        <h1 style="font-size: 2.5rem; line-height: 1.2; margin-bottom: 15px;">Sei il mio raggio di sole in una giornata tempestosa.<br>Principessa 💛</h1>
        <p class="instruction">Toca cada flor del ramo para ver su mensajito 🌻</p>
    </div>
    
    <div id="message-card" class="card hidden">
        <div class="card-content"></div>
    </div>

    <div id="bouquet-container">
        <div id="flowers-layer"></div>
        <div class="paper-wrapper-back"></div>
        <div class="paper-wrapper-front">
            <div class="fold fold-left"></div>
            <div class="fold fold-right"></div>
            <div class="ribbon"></div>
            <div class="bow"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
